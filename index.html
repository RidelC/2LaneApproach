{ id: "4.1.4", aspect: "conception", level: 1, name: "Délimitation des problèmes", alt: "Détermination du champ d’application du problème", pages: "p. 35-36",
  quick: "L’élève se demande si l’IA est la bonne réponse avant de l’utiliser, et sait définir clairement un problème avant d’y appliquer l’IA.",
  attendu: [
    "Comprendre l’importance de la « définition du problème d’IA » comme point de départ de l’innovation.",
    "Examiner si l’IA devrait être utilisée dans une situation donnée d’un point de vue juridique, éthique et logique.",
    "Définir les limites, objectifs et contraintes d’un problème avant d’entraîner un modèle ; acquérir les compétences de planification de projet nécessaires pour concevoir un système d’IA."],
  cg: [
    { c: "CG4.1.4.1", t: "Développer la pensée critique quant aux cas où l’IA ne devrait pas être utilisée.", d: "Analyser pourquoi l’IA devrait ou non être utilisée face à un défi réel, au regard des implications humaines et environnementales ; préciser quand elle ne peut ou ne doit pas être appliquée (solution non-IA équivalente avec moins de risque, affaiblissement de la conscience humaine, manipulation des actions)." },
    { c: "CG4.1.4.2", t: "Favoriser l’acquisition et le renforcement des compétences en matière de définition d’un problème à résoudre par un système d’IA.", d: "Par un projet de simulation, identifier et définir un problème qui devrait et pourrait être résolu par un nouveau modèle ; formuler des énoncés de problème précis pour ne pas perdre temps et efforts." },
    { c: "CG4.1.4.3", t: "Développer des compétences pour évaluer les besoins des systèmes d’IA en matière de données, d’algorithmes et de ressources informatiques.", d: "Évaluer les besoins en données, algorithmes, logiciels, capacités informatiques et matériel ; étudier la faisabilité au regard des restrictions réglementaires et éthiques et des coûts." }],
  methodes: [
    { t: "Simuler l’examen d’une proposition de projet", d: "Débat pour décider si l’IA devrait être utilisée (données suffisantes, implications éthiques, impact environnemental, solutions alternatives) ; prévoir dans l’examen une case à cocher." },
    { t: "Simuler la définition du problème et la justification d’un nouveau système d’IA", d: "Chercher un problème dans la vie quotidienne ou la communauté (arrosage automatique du jardin de l’école…), le cerner et produire un énoncé de problème." },
    { t: "Laboratoire de prétraitement des données", d: "Expérimenter sur un jeu de données de base et observer comment le prétraitement affecte les performances du modèle." }],
  env: ["Feuilles de travail et études de cas sur papier, impressions de prototypes ou de plans (hors connexion)", "Appareils numériques avec connexion à Internet", "Systèmes d’IA en ligne dûment sélectionnés"] },

{ id: "4.2.1", aspect: "humain", level: 2, name: "Responsabilité humaine", alt: "", pages: "p. 37-39",
  quick: "L’élève comprend que responsabilité et décision restent humaines même quand l’IA aide, et défend ce principe.",
  attendu: [
    "Reconnaître que les responsabilités humaines sont des obligations légales des créateurs et fournisseurs de services d’IA, et comprendre ses propres responsabilités quand il conçoit ou utilise l’IA.",
    "Prendre conscience que la responsabilité est juridique et sociale quand l’IA aide à décider, et défendre le principe de ne pas céder le pouvoir de décision à l’IA pour les enjeux cruciaux.",
    "Améliorer son jugement et son esprit critique face aux affirmations trompeuses et aux prédictions selon lesquelles l’IA peut se substituer à la pensée et à la décision humaines."],
  cg: [
    { c: "CG4.2.1.1", t: "Adopter un point de vue selon lequel la responsabilité humaine constitue une obligation légale pour les créateurs d’IA et les fournisseurs de services.", d: "Comprendre que créateurs, prestataires et institutions qui déploient des outils d’IA répondent des problèmes juridiques et des violations que le système peut causer ; et quelles responsabilités les apprenants assumeront en créant des outils d’IA." },
    { c: "CG4.2.1.2", t: "Faire comprendre que la responsabilité humaine est une responsabilité juridique et sociale lorsqu’on utilise l’IA pour prendre des décisions concernant l’humanité.", d: "Poser des questions critiques sur les capacités réelles des outils et démystifier le battage médiatique ; évaluer les conséquences de l’usage institutionnel de l’IA pour décider (profilage, employabilité) ; comprendre pourquoi ne pas l’utiliser pour remplacer l’humain dans les décisions à fort enjeu (notes, admissions)." },
    { c: "CG4.2.1.3", t: "Cultiver une posture réflexive selon laquelle la responsabilité humaine exige des compétences personnelles pour orienter l’utilisation intentionnelle de l’IA.", d: "S’interroger sur la manière dont l’automatisation des analyses documentaires, de la rédaction et de la création artistique peut nuire à la réflexion et au développement intellectuel ; discuter d’actions concrètes pour se protéger et protéger ses pairs contre l’usurpation de la pensée humaine par les résultats de l’IA." }],
  methodes: [
    { t: "Rédiger des lignes directrices sur la responsabilité humaine", d: "Jouer des créateurs d’IA et des propriétaires de données, discuter de leurs responsabilités juridiques et éthiques ; rédiger des lignes directrices d’autodiscipline." },
    { t: "Étudier l’impact des décisions prises par l’IA et les voies de recours", d: "Chercher des exemples où l’IA détermine ou influence fortement des décisions (prêt étudiant, profilage…) ; révéler le rôle des humains et de l’IA dans les boucles de décision." },
    { t: "Pratiques sur des scénarios d’utilisation de l’IA dans un but précis", d: "Utiliser l’IA pour exercer volontairement ses compétences d’écriture, de recherche, de réflexion ; discuter de la façon dont l’usage de l’IA sans responsabilité humaine (remettre une dissertation produite par l’IA) peut réduire le développement intellectuel ; définir des actions concrètes." }],
  env: ["Paramètres et ressources hors connexion (études de cas imprimées, scénarios de jeux de rôle, vidéos, feuilles de travail)", "Outils d’IA en ligne : systèmes de gestion de l’apprentissage, plateformes de médias sociaux et d’IA générative"] },

{ id: "4.2.2", aspect: "ethique", level: 2, name: "Utilisation sûre et responsable", alt: "Usage sécuritaire et responsable", pages: "p. 39-41",
  quick: "L’élève utilise l’IA de façon responsable : il protège ses données et celles des autres, respecte les droits d’auteur et signale ce qui vient de l’IA.",
  attendu: [
    "Mettre en œuvre des pratiques d’IA responsables, dans le respect des principes éthiques et des réglementations locales.",
    "Être conscient des risques liés à la divulgation de données personnelles et agir pour qu’elles ne soient collectées, utilisées, partagées, archivées et supprimées qu’avec son consentement délibéré et éclairé.",
    "Connaître les incidents typiques de l’IA et les risques de certains systèmes, et savoir protéger sa sécurité et celle de ses pairs."],
  cg: [
    { c: "CG4.2.2.1", t: "Favoriser la conscience de soi et le respect usuel des principes éthiques pour l’utilisation responsable de l’IA.", d: "Construire et mettre à jour une « case à cocher » de principes : protection des données personnelles et de la vie privée, droits d’auteur, indication claire de l’endroit où apparaît le contenu généré par l’IA, éviter les entrées qui impliquent désinformation, discours haineux ou détails sensibles sur des personnes identifiables." },
    { c: "CG4.2.2.2", t: "Offrir des possibilités de renforcer l’autodiscipline dans l’utilisation responsable de l’IA.", d: "Comprendre ses responsabilités personnelles, juridiques et éthiques et les conséquences d’une violation des règles ; s’autodiscipliner sur les données personnelles sensibles, les documents protégés, les images de personnes identifiables, le contenu généré par l’IA, la diffusion de fausses informations et de discours haineux." },
    { c: "CG4.2.2.3", t: "Approfondir les connaissances pratiques sur l’utilisation sécuritaire de l’IA et la sensibilisation aux réglementations locales en vigueur.", d: "Catégoriser les risques de sécurité généraux et ceux d’outils précis, ainsi que les incidents typiques ; connaître ses droits sur les données et la vie privée ; s’exercer, sur des incidents simulés, à des stratégies de précaution." }],
  methodes: [
    { t: "Concevoir un « kit éthique » pour une utilisation autodisciplinée et responsable de l’IA", d: "À partir de scénarios de conflit éthique (partager des données privées ou protégées avec une IA, insérer du contenu généré par l’IA dans un travail scolaire, créer une vidéo avec les images d’autres personnes, diffuser de la désinformation), rédiger un kit à vérifier régulièrement." },
    { t: "Simulation d’incidents typiques liés à l’IA et gestion des risques", d: "Simulations d’incidents ; stratégies préventives pour que les données personnelles ne soient utilisées qu’avec consentement éclairé ; conseils de sécurité ; sensibilisation aux réglementations protectrices." },
    { t: "Commentaires des utilisateurs sur les politiques de confidentialité", d: "Rechercher des politiques de confidentialité de créateurs d’IA, vérifier leur conformité ; en cas de violation, rédiger une plainte ou une recommandation." },
    { t: "Débattre de la propriété des contenus générés par l’IA", d: "Débat sur la propriété des contenus créés avec l’IA ; examiner les règles de droit d’auteur applicables à ces contenus." }],
  env: ["Paramètres hors connexion (feuilles de travail, affiches, listes de contrôle des principes éthiques)", "Politiques de confidentialité et réglementations préalablement téléchargées, exemples de cas juridiques ou éthiques", "Outils d’IA disponibles localement, dont applications pour smartphones", "Outils d’IA en ligne, en particulier plateformes à algorithmes de recommandation et générateurs de contenu"] },

{ id: "4.2.3", aspect: "technique", level: 2, name: "Compétences pour l’application", alt: "", pages: "p. 41-43",
  quick: "L’élève sait manier des outils, données et bibliothèques d’IA libres et les évaluer de façon critique : il passe de la compréhension au maniement.",
  attendu: [
    "Construire une structure de connaissances adaptée à son âge sur les données, les algorithmes d’IA et la programmation, et acquérir des compétences d’application transférables.",
    "Évaluer de manière critique et exploiter des outils d’IA, des bibliothèques de programmation et des ensembles de données gratuits et/ou libres."],
  cg: [
    { c: "CG4.2.3.1", t: "Offrir des possibilités de renforcer les connaissances et les compétences en matière de modélisation, d’ingénierie et d’analyse des données.", d: "Apprentissage par tâches concrètes sur les jeux de données : acquérir, nettoyer et transformer les données dans un format adapté au stockage, au traitement et à l’analyse." },
    { c: "CG4.2.3.2", t: "Offrir des possibilités d’acquérir des compétences techniques adaptées à l’âge en matière de programmation de l’IA.", d: "Expliquer des exemples de systèmes par catégorie d’algorithmes (supervisé, non supervisé, par renforcement) : comment ils recueillent et traitent les données, sont entraînés, fonctionnent." },
    { c: "CG4.2.3.3", t: "Encourager les apprenants à développer des compétences d’analyse et de synthèse pour exploiter des ensembles de données et des outils d’IA libres (open source).", d: "Apprentissage par problèmes pour évaluer de manière critique et exploiter des jeux de données libres (MNIST, CIFAR, ImageNet) et des outils (Teachable Machine, PyTorch, Keras) sur des tâches réelles ; améliorer la transférabilité des acquis." }],
  methodes: [
    { t: "Laboratoire sur les biais des données", d: "Expériences pratiques sur l’impact des valeurs aberrantes ou du déséquilibre des classes sur les performances du modèle ; éliminer les biais identifiables et comparer les résultats." },
    { t: "Cours modulaires optionnels sur divers algorithmes d’IA", d: "Soutenir l’apprentissage par cohortes, selon les intérêts." },
    { t: "Hackathons sur l’IA à partir de variantes de tâches authentiques", d: "Série de tâches avec variantes pour mettre en pratique des compétences transférables en programmation de l’IA." },
    { t: "Démentir l’idée que l’IA automatisera le codage", d: "Rechercher les connaissances professionnelles requises ; réfléchir aux inégalités qui s’aggraveraient si moins de personnes acquièrent ces compétences fondamentales." }],
  env: ["Ordinateurs avec connexion Internet", "Échantillons ou jeux de données publics accessibles localement", "Applications de programmation de l’IA ou bibliothèques open source", "Outils d’IA informatisés ou accessibles en ligne"] },

{ id: "4.2.4", aspect: "conception", level: 2, name: "Conception de l’architecture", alt: "", pages: "p. 43-44",
  quick: "L’élève sait comparer des solutions techniques et monter un prototype simple de système d’IA en y intégrant éthique et durabilité.",
  attendu: [
    "Cultiver des connaissances méthodologiques et des compétences techniques de base pour configurer une architecture évolutive, maintenable et réutilisable (couches de données, d’algorithmes, de modèles, d’interfaces).",
    "Construire un prototype de système d’IA à partir de jeux de données, d’outils de programmation et de ressources informatiques.",
    "Appliquer des valeurs humanistes et des principes éthiques approfondis dans la configuration, la construction et l’optimisation."],
  cg: [
    { c: "CG4.2.4.1", t: "Étayer l’acquisition de connaissances méthodologiques et de compétences techniques sur l’architecture de l’IA.", d: "Évaluer des architectures pour choisir une solution adaptée à un énoncé de problème ; configurer un prototype avec structure de données anti-biaisée, modèle économe en énergie, conception centrée sur l’humain, mesures pour tester et améliorer." },
    { c: "CG4.2.4.2", t: "Soutenir l’élaboration des compétences techniques avancées et des compétences de gestion de projet nécessaires à la construction d’un système d’IA.", d: "Projet de prototype pour une tâche simple (par exemple un chatbot imitant les réponses d’un enseignant expérimenté) ; simuler l’entraînement d’un modèle ; gestion de projet : équilibrer la portée avec les ressources, répartir les responsabilités, évaluer de façon critique les ressources d’IA." }],
  methodes: [
    { t: "Simuler l’évaluation de cadres et de composants d’architecture", d: "Évaluer des cadres (TensorFlow, PyTorch, Scikit-learn), configurer un prototype, partager la configuration par organigrammes, diagrammes ou pseudo-code." },
    { t: "Simuler l’exploitation des ressources pour construire un système d’IA", d: "Construire un système simulé sur dispositifs locaux ou en nuage ; chercher des compromis entre coûts et capacité de calcul, et entre robustesse des modèles et impact environnemental." },
    { t: "Simuler l’amélioration de l’architecture", d: "Optimisation des hyper-paramètres et/ou réglage fin de modèles existants pour résoudre des problèmes simples." }],
  env: ["Vidéos et indicateurs montrant comment mener des évaluations éthiques et techniques de modèles d’IA", "Exemples de systèmes d’IA sur ordinateur ou en ligne localement", "Jeux de données publics, bibliothèques open source", "Ressources de calcul en nuage hébergées localement ou partagées par les institutions"] },

{ id: "4.3.1", aspect: "humain", level: 3, name: "Citoyenneté à l’ère de l’IA", alt: "La citoyenneté dans la société de l’IA", pages: "p. 45-47",
  quick: "L’élève se pense comme citoyen d’une société où l’IA est partout : regard critique, responsabilités assumées, curiosité durable.",
  attendu: [
    "Développer une pensée critique sur les conséquences de l’IA pour les sociétés et élargir ses valeurs pour promouvoir une conception et une utilisation de l’IA au service d’un développement inclusif et écoresponsable.",
    "Renforcer ses valeurs civiques et son sens de la responsabilité sociale comme citoyen d’une société de l’IA.",
    "Accroître son ouverture d’esprit et sa curiosité permanente pour l’apprentissage et l’utilisation de l’IA, au service de l’épanouissement personnel."],
  cg: [
    { c: "CG4.3.1.1", t: "Être un citoyen critique en matière d’IA : favoriser cette prise de conscience.", d: "Connaissances factuelles sur l’adoption généralisée de l’IA comme infrastructure des activités sociales ; critique des préjugés amplifiés par l’IA envers les femmes, les groupes ethniques marginalisés et les personnes défavorisées ; effets sur les relations et structures sociales ; adaptation des règles juridiques, éthiques et sociales." },
    { c: "CG4.3.1.2", t: "Favoriser les responsabilités personnelles et sociales dans les sociétés d’IA.", d: "Partager ses points de vue sur des sociétés d’IA souhaitables et définir les responsabilités des citoyens pour construire une société inclusive, écoresponsable et juste ; examiner les défis du respect des principes éthiques dans des situations authentiques complexes." },
    { c: "CG4.3.1.3", t: "Nourrir le sentiment d’accomplissement personnel en tant que citoyen de l’IA et l’attitude d’apprentissage tout au long de la vie à l’égard de l’IA.", d: "Examiner l’impact de l’adoption de l’IA dans tous les secteurs et les compétences que la vie et le travail pourront exiger ; réfléchir à ses objectifs personnels dans une société où l’IA est omniprésente." }],
  methodes: [
    { t: "Études de cas : société de l’IA juste et inclusive contre les menaces de l’IA", d: "Analyser des cas où l’IA amplifie les préjugés, creuse les inégalités, affaiblit l’agentivité humaine, aggrave le changement climatique ; prendre et défendre des positions sur la régulation de l’IA existante et l’orientation des prochaines générations." },
    { t: "Étude des responsabilités sociales personnelles des citoyens", d: "Discussions de groupe sur les droits et obligations des citoyens d’une société d’IA, en tenant compte du contexte mondial et local." },
    { t: "Études de cas sur l’accomplissement personnel et l’apprentissage tout au long de la vie", d: "Adoption de l’IA dans le travail, la vie et les pratiques sociales ; implications pour les objectifs personnels et la carrière." }],
  env: ["Paramètres et ressources hors connexion (feuilles de travail, rapports ou vidéos sur l’emploi et l’évolution de carrière, études de cas imprimées)", "Systèmes d’IA en ligne ou outils locaux pour tests expérimentaux et analytiques : assistants personnels, chatbots, systèmes de tutorat intelligents sur smartphones"] },

{ id: "4.3.2", aspect: "ethique", level: 3, name: "Éthique dès la conception", alt: "Ethics by design", pages: "p. 47-48",
  quick: "L’élève sait évaluer, auditer et critiquer un outil d’IA selon des critères éthiques, et proposer d’adapter les règles.",
  attendu: [
    "Adopter une approche éthique pour la conception, l’évaluation et l’utilisation des outils d’IA, et pour l’examen et l’adaptation des réglementations.",
    "Comprendre que l’évaluation de l’intention de conception doit commencer dès la conceptualisation et couvrir tout le cycle de vie.",
    "Appliquer des paramètres pour évaluer la conformité d’un outil aux règles éthiques et utiliser une matrice éthique qui prend en compte toutes les parties prenantes."],
  cg: [
    { c: "CG4.3.2.1", t: "Sensibiliser à l’« éthique dès la conception » et la faire comprendre.", d: "Apprentissage à base de conflits pour appliquer un ensemble complet de principes éthiques tout au long du cycle de conception ; évaluer la pertinence éthique d’outils en cours de conceptualisation : lutte contre les préjugés dans la collecte de données, méthodes sans discrimination, « garde-fous » centrés sur l’humain, tests et audits inclusifs." },
    { c: "CG4.3.2.2", t: "Développer une attitude critique à l’égard des principes d’éthique dès la conception qui sous-tendent les systèmes et algorithmes d’IA existants.", d: "Évaluer de façon holistique l’« éthique dès la conception » de systèmes précis ; proposer des recommandations aux créateurs pour remédier aux violations identifiées et atténuer les préjudices." },
    { c: "CG4.3.2.3", t: "Cultiver les responsabilités sociales pour défendre l’« éthique dès la conception » dans les réglementations sur l’IA.", d: "Évaluer comment des réglementations s’alignent sur cette approche et si leurs mesures suffisent ; recommander des modifications des réglementations locales ou rédiger des propositions." }],
  methodes: [
    { t: "Simuler le devoir de diligence d’un « responsable de l’éthique »", d: "Jouer ce rôle dans une équipe de développement : liste de critères éthiques d’audit, procédures de diligence raisonnable." },
    { t: "Simuler l’usage d’un « label éthique » pour auditer des outils d’IA", d: "Audit fictif ; label analogue à l’étiquette nutritionnelle des aliments ; vérifier l’intention des concepteurs au-delà de leurs déclarations publiques ; rédiger un rapport d’audit." },
    { t: "Simuler l’usage d’une matrice éthique pour examiner les réglementations", d: "Colonnes : principes éthiques ; lignes : parties prenantes (créateurs, régulateurs, institutions, utilisateurs) ; analyser les articles d’une réglementation et recommander des adaptations." }],
  env: ["Feuilles de travail, tableaux papier, exemples imprimés de contrôles et de rapports de diligence, labels éthiques, matrices, politiques de confidentialité", "Outils d’IA disponibles localement ; systèmes d’IA en ligne pour l’analyse éthique", "Sites web partageant des réglementations sur l’IA, des procès ou des affaires judiciaires"] },

{ id: "4.3.3", aspect: "technique", level: 3, name: "Création d’outils d’IA", alt: "", pages: "p. 49-50",
  quick: "L’élève personnalise ou crée un petit outil d’IA pour une tâche réelle, le teste et l’améliore, avec une perspective humaine et éthique.",
  attendu: [
    "Approfondir et appliquer ses connaissances sur les données et les algorithmes pour personnaliser des outils d’IA existants et créer des outils pour des tâches précises.",
    "Intégrer les principes d’une perspective centrée sur l’humain et ses considérations éthiques dans l’évaluation des ressources d’IA et le test de ses propres outils.",
    "Développer les compétences sociales et émotionnelles (adaptabilité, communication, travail d’équipe) nécessaires pour créer avec l’IA."],
  cg: [
    { c: "CG4.3.3.1", t: "Mettre au défi et activer des compétences avancées pour développer des outils d’IA basés sur des tâches.", d: "Analyse critique de la pertinence d’outils existants pour des tâches précises, évaluation des besoins de collecte et de traitement des données, choix entre programmation schématisée (low code) ou algorithmes d’IA et langage de programmation." },
    { c: "CG4.3.3.2", t: "Renforcer la créativité des apprenants en appliquant les connaissances d’IA.", d: "Tâches de personnalisation d’outils d’IA pour résoudre des tâches authentiques ; utiliser des plateformes ou boîtes à outils de développement ; explorer et tester des idées créatives." },
    { c: "CG4.3.3.3", t: "Donner aux apprenants les compétences nécessaires pour tester et optimiser les outils d’IA qu’ils ont eux-mêmes créés.", d: "Personnaliser les méthodes d’évaluation pour tester la robustesse et la facilité d’usage ; organiser des évaluations par les pairs et partager le retour d’information ; collaborer comme cocréateurs." }],
  methodes: [
    { t: "Améliorer jeux de données et codes pour créer un outil d’IA", d: "Modifier ou créer un jeu de données pour des contextes réels (consommation d’énergie de l’école, prévisions météo, suivi d’une épidémie) ; outils de collecte automatique de données." },
    { t: "Laboratoire de test des performances des applications d’IA", d: "Tester performance et robustesse avec des mesures (exactitude, précision, score F-1, matrices de confusion, courbes ROC) ; simuler le retour d’utilisateurs sur le respect de l’éthique." },
    { t: "Comparer création par code et par plateformes de programmation schématisée", d: "Discuter des différences en termes d’agentivité humaine, d’inclusion de données locales, de diversité culturelle, d’évolutivité et de réutilisation." }],

/* ---------- utilitaires de modèle ---------- */
function clamp(x,a,b){ return Math.max(a,Math.min(b,x)); }
/* Migration : les anciens fichiers placent l’activité de voie 2 dans la liste des séances.
   Elle devient une période (deb, fin) exprimée en « intervalles » entre séances : 0 = avant la séance 1, n = après la dernière. */
function normalize(s){
  if(!s||!s.v2||!s.items) return s;
  var p=-1; for(var i=0;i<s.items.length;i++) if(s.items[i].type==="v2") p=i;
  if(p>=0){ s.items=s.items.filter(function(x){return x.type!=="v2";}); if(typeof s.v2.deb!=="number"){ s.v2.deb=p; s.v2.fin=p; } }
  var n=s.items.length, d=parseInt(s.v2.deb,10), f=parseInt(s.v2.fin,10);
  if(isNaN(d)) d=0; d=clamp(d,0,n); if(isNaN(f)) f=d; f=clamp(f,d,n);
  s.v2.deb=d; s.v2.fin=f; s.ver=2; if(!s.acquis) s.acquis=[]; return s;
}
function acqCode(id){ for(var i=0;i<state.acquis.length;i++) if(state.acquis[i].id===id) return "A"+(i+1); return "?"; }
function codes(ids){ return (ids||[]).map(acqCode).join(" "); }
function phaseOf(it){ return it.type==="v2" ? "ia" : (it.type==="v1" ? "verif" : it.phase); }
function itemTitle(it){ return it.type==="v2" ? (state.v2.titre || "Activité de voie 2") : (it.titre || "(sans titre)"); }
function minutes(it){ var n = it.type==="v2" ? state.v2.duree : it.duree; n=parseInt(n,10); return isNaN(n)?0:n; }
function lie(it){ return it.lie!==false; }
function idx(id){ for(var i=0;i<state.items.length;i++) if(state.items[i].id===id) return i; return -1; }
function shortT(it){ var s=itemTitle(it); return s.length>30 ? s.slice(0,29)+"…" : s; }
function gapStart(g){ var it=state.items; if(!it.length) return "—"; return g<=0 ? "avant la séance 1" : "après la séance "+g+" · "+shortT(it[g-1]); }
function gapEnd(g){ var it=state.items; if(!it.length) return "—"; return g>=it.length ? "après la dernière séance" : "avant la séance "+(g+1)+" · "+shortT(it[g]); }
function periodText(){ var v=state.v2; return "Lancé "+gapStart(v.deb)+" ; rendu "+gapEnd(v.fin); }
function shiftWindow(at,early){ var v=state.v2; if(at<v.deb||(at===v.deb&&early)) v.deb++; if(at<v.fin||(at===v.fin&&early)) v.fin++; }
function unshiftWindow(i){ var v=state.v2, n=state.items.length; if(i<v.deb) v.deb--; if(i<v.fin) v.fin--; v.deb=clamp(v.deb,0,n); v.fin=clamp(v.fin,v.deb,n); }
function insertByPhase(it){
  var r = RANK[phaseOf(it)], at = 0;

  state.items.splice(at,0,it); shiftWindow(at, r<3);
}
function cgLabel(code){ var x=cgIdx[code]; return x ? (x.c.c+" · "+x.c.t) : ""; }

/* ---------- vérifications ---------- */
function runChecks(){
  var c=[], s=state, v2=s.v2, items=s.items;
  var v1all=items.filter(function(i){return i.type==="v1";}), v1=v1all.filter(lie), app=items.filter(function(i){return i.type==="app";});
  function add(l,t,d){ c.push({l:l,t:t,d:d||""}); }
  add(v2.titre && v2.cg ? "ok":"err", "Activité de voie 2 située", v2.titre && v2.cg ? "Titre et compétence UNESCO renseignés." : "Renseignez au moins le titre et la compétence UNESCO (étape 1).");
  add(s.acquis.length ? "ok":"err", s.acquis.length+" acquis visé"+(s.acquis.length>1?"s":""), s.acquis.length ? "" : "Sans acquis, rien ne peut être vérifié en voie 1 (étape 2).");
  if(s.acquis.length>6) add("warn","Plus de six acquis","Trop d’acquis rendent la voie 1 difficile à tenir : regroupez ou priorisez.");
  s.acquis.forEach(function(a){
    var vs = v1.filter(function(x){return (x.acquis||[]).indexOf(a.id)>=0;});

    else if(!(x.acquis||[]).length) add("err","Contrôle relié sans acquis vérifié : "+itemTitle(x),"Un contrôle relié à la voie 2 doit vérifier au moins un acquis ; sinon, déclarez-le indépendant.");

    if(!(x.criteres||"").trim()) add("warn","Critères de réussite manquants : "+itemTitle(x),"Sans critères, la vérification n’est pas comparable d’un élève à l’autre.");
  });

  add(before?"ok":"warn", before? before+" séance(s) d’apprentissage avant le lancement du travail":"Aucune séance d’apprentissage avant le lancement du travail", before?"":"Prévoyez au moins un amorçage ou une préparation avant de confier le travail aux élèves.");
  add(after?"ok":"warn", after? after+" séance(s) d’apprentissage après le rendu":"Aucune séance après le rendu du travail", after?"":"Un retour réflexif après l’activité nourrit la métacognition.");

    var covered = v2.fils[k] || app.some(function(x){return x.fils && x.fils[k];});

  else if(a==="delAcq"){ state.acquis=state.acquis.filter(function(x){return x.id!==id;}); state.items.forEach(function(it){ if(it.acquis) it.acquis=it.acquis.filter(function(x){return x!==id;}); }); [draft.app,draft.v1].forEach(function(d){ if(d) d.acquis=d.acquis.filter(function(x){return x!==id;}); }); render(); }
  else if(a==="metasug"){ var c=CAUSES.filter(function(x){return x.id===state.v2.causeId;})[0]; if(c){ state.v2.reflexif=c.meta; render(); } }
  else if(a==="import") importText();
  else if(a==="tplApp"){ var tp=APP_TPL[+t.dataset.i]; draft.app=newDraftApp(); draft.app.titre=tp.t; draft.app.phase=tp.phase; draft.app.desc=tp.d; tp.fils.forEach(function(k){draft.app.fils[k]=true;}); render(); }
  else if(a==="tplUn"){ var cg=cgIdx[state.v2.cg]; if(cg){ var m=cg.b.methodes[+t.dataset.i]; draft.app=newDraftApp(); draft.app.titre=m.t; draft.app.desc=m.d; render(); } }
  else if(a==="tplV1"){ var v1=state.items.filter(function(i){return i.type==="v1" && lie(i);}); var unc=state.acquis.filter(function(x){return !v1.some(function(y){return (y.acquis||[]).indexOf(x.id)>=0;});}); draft.v1=newDraftV1(); draft.v1.acquis=unc.map(function(x){return x.id;}); draft.v1.titre="Vérification de "+unc.map(function(x){return acqCode(x.id);}).join(", "); render(); }
  else if(a==="saveApp"){ var d=draft.app; if(!d.titre.trim()){ alert("Donnez un titre à la séance."); return; }
    if(d.editId){ var i=idx(d.editId); var o=JSON.parse(JSON.stringify(d)); o.id=d.editId; delete o.editId; state.items[i]=o; } else { var o2=JSON.parse(JSON.stringify(d)); o2.id=uid(); delete o2.editId; insertByPhase(o2); }
    draft.app=newDraftApp(); render(); }
  else if(a==="saveV1"){ var d1=draft.v1; if(!d1.titre.trim()){ alert("Donnez un titre au contrôle."); return; } if(d1.lie!==false && !d1.acquis.length){ alert("Cochez au moins un acquis vérifié, ou déclarez le contrôle indépendant."); return; }
    if(d1.lie===false) d1.acquis=[]; if(!d1.format){ alert("Choisissez un format."); return; }
    if(d1.editId){ var j=idx(d1.editId); var p=JSON.parse(JSON.stringify(d1)); p.id=d1.editId; delete p.editId; state.items[j]=p; } else { var p2=JSON.parse(JSON.stringify(d1)); p2.id=uid(); delete p2.editId; insertByPhase(p2); }
    draft.v1=newDraftV1(); render(); }
  else if(a==="cancelDraft"){ draft[t.dataset.k]=null; render(); }
  else if(a==="editItem") editItem(id);
  else if(a==="delItem"){ if(confirm("Supprimer cet élément de la séquence ?")){ var di=idx(id); state.items=state.items.filter(function(x){return x.id!==id;}); if(di>=0) unshiftWindow(di); render(); } }
  else if(a==="up") move(id,-1); else if(a==="down") move(id,1);
  else if(a==="print"){ window.print(); }
  else if(a==="copytxt") copyText(textExport());
  else if(a==="save"){ var blob=new Blob([JSON.stringify(state,null,1)],{type:"application/json"}); var u=URL.createObjectURL(blob), l=document.createElement("a"); l.href=u; l.download="two-lane-atelier2.json"; document.body.appendChild(l); l.click(); l.remove(); setTimeout(function(){URL.revokeObjectURL(u);},1000); }
  else if(a==="reset"){ if(confirm("Effacer tout le travail en cours ?")){ state=blank(); draft={app:null,v1:null}; render(); } }
  else if(a==="example"){ if(!state.acquis.length || confirm("Remplacer le travail en cours par l’exemple ?")){ state=exampleData(); draft={app:null,v1:null}; render(); } }
});
function buildPrint(){ var p=document.getElementById("printdoc"); p.innerHTML=synthHTML(true); var f=document.getElementById("pfrise"); if(f) drawLinks(f); }
window.addEventListener("beforeprint", buildPrint);
window.addEventListener("afterprint", function(){ document.getElementById("printdoc").innerHTML=""; });
window.addEventListener("resize", function(){ drawLinks(document.getElementById("frise")); });
document.getElementById("frwrap").addEventListener("toggle", function(){ if(this.open) drawLinks(document.getElementById("frise")); });
load(); render();
window.__tl = {get state(){return state;}, buildPrint:buildPrint};
})();
